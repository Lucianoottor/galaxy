<!doctype html>
<style>body{margin:0;overflow:hidden;background:#000}canvas{display:block}
#overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(30,30,30,0.5);pointer-events:none}</style>
<canvas id="game"></canvas>
<div id="overlay"></div>
<script>
const BACKGROUND = "rgba(0, 0, 0, 1)"

game.width = window.innerWidth
game.height = window.innerHeight
const ctx = game.getContext("2d")

function clear() {
    ctx.fillStyle = BACKGROUND
    ctx.fillRect(0, 0, game.width, game.height)
}

const GLOW_R = 32;
const glow = document.createElement("canvas");
glow.width = glow.height = GLOW_R * 2;
const gctx = glow.getContext("2d");
const grad = gctx.createRadialGradient(GLOW_R, GLOW_R, 0, GLOW_R, GLOW_R, GLOW_R);
grad.addColorStop(0, "rgba(180,200,255,0.6)");
grad.addColorStop(0.15, "rgba(140,170,255,0.3)");
grad.addColorStop(0.5, "rgba(100,140,255,0.06)");
grad.addColorStop(1, "rgba(60,100,255,0)");
gctx.fillStyle = grad;
gctx.fillRect(0, 0, glow.width, glow.height);

function points(xs, ys, n) {
    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < n; ++i) {
        const sx = (xs[i] + 1)/2*game.width;
        const sy = (1 - (ys[i] + 1)/2)*game.height;
        ctx.drawImage(glow, sx - GLOW_R, sy - GLOW_R);
    }
    ctx.globalCompositeOperation = "source-over";
}

let fps = 0;
let lastFrameTime = performance.now();

function drawFps() {
    // exponential moving average so the number doesn't jitter every frame
    const now = performance.now();
    const instantFps = 1000 / (now - lastFrameTime);
    lastFrameTime = now;
    fps += (instantFps - fps) * 0.1;

    ctx.font = "16px monospace";
    ctx.fillStyle = "#ffffff";
    ctx.fillText(`${fps.toFixed(0)} FPS`, 10, 20);
}

const FPS = 60;
const N = 1000;

WebAssembly.instantiateStreaming(fetch("output.wasm"), {})
    .then(({instance}) => {
        const { init, tick, x_ptr, y_ptr, len, memory } = instance.exports;

        init(N, 42);
        const xPtr = x_ptr();
        const yPtr = y_ptr();
        const n = len();

        function frame() {
            tick();
            // Struct-of-Arrays: x and y are each their own contiguous buffer now,
            // so no interleaved stride math needed to read them.
            const xs = new Float32Array(memory.buffer, xPtr, n);
            const ys = new Float32Array(memory.buffer, yPtr, n);

            clear();
            points(xs, ys, n);
            drawFps();
            setTimeout(frame, 1000/FPS);
        }
        setTimeout(frame, 1000/FPS);
    });
</script>
